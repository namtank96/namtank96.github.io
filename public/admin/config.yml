# Sveltia CMS 설정
#
# 이 파일은 src/content.config.ts 의 zod 스키마와 정확히 맞아야 합니다.
# 어긋나면 CMS 가 저장한 글이 빌드를 깹니다. 스키마를 고치면 여기도 같이 고치세요.
#
# 로그인: 관리자 화면에서 "Sign in with Token" 을 누르고 본인 GitHub 토큰을 넣습니다.
#         OAuth 앱도 서버도 필요 없고, 토큰은 브라우저에만 저장됩니다.

backend:
  name: github
  repo: namtank96/namtank96.github.io
  branch: main
  commit_messages:
    create: 'content: {{collection}} 「{{slug}}」 추가'
    update: 'content: {{collection}} 「{{slug}}」 수정'
    delete: 'content: {{collection}} 「{{slug}}」 삭제'

# 이미지를 쓰지 않는 사이트지만, 위젯이 요구하므로 자리만 잡아둡니다.
media_folder: public/uploads
public_folder: /uploads

publish_mode: simple
locale: ko

collections:
  # ────────────────────────────────────────────────────────────
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    description: >-
      어디서 무슨 일을 했고 무엇을 판단했는지. 식별 수준은 업종·규모까지입니다 —
      고객사명·사내 과제명·플랫폼명을 쓰면 배포 전 살균 게이트가 막습니다.
    folder: src/data/projects
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, start, title]
    fields:
      - { label: 건명, name: title, widget: string, hint: 업종 + 무엇을 한 건인가. 고유명 금지 }
      - label: 업종
        name: industry
        widget: select
        options:
          - { label: 금융, value: finance }
          - { label: 공공, value: public }
          - { label: 제조, value: manufacturing }
          - { label: 교육, value: education }
          - { label: 통신, value: telco }
          - { label: 사내, value: internal }
          - { label: 기타, value: other }
      - { label: 규모, name: scale, widget: string, required: false, hint: 범위로. 정확한 금액·인원 금지 }
      - { label: 시작, name: start, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: 종료, name: end, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, required: false, hint: 비우면 '현재' }
      - { label: 소속, name: at, widget: string, hint: 'experience 파일명. 예: ax-bizdev' }
      - { label: 내 역할, name: role, widget: string }
      - { label: 상황, name: situation, widget: text, hint: 왜 이 일이 시작됐는가 }
      - label: 한 일
        name: did
        widget: list
        field: { label: 항목, name: item, widget: string }
      - label: 판단
        name: judgment
        widget: list
        required: false
        summary: '{{fields.call}}'
        hint: 이 사이트가 경력기술서와 갈리는 지점. 지어내지 말고 실제로 내린 결정만.
        fields:
          - { label: 무엇을 정했나, name: call, widget: string }
          - { label: 왜 그렇게 정했나, name: why, widget: text }
      - { label: 결과, name: result, widget: text, required: false, hint: 확인 가능한 것만. 없으면 비웁니다 }
      - label: 관련 자산
        name: assetRefs
        widget: list
        required: false
        field: { label: 코드, name: code, widget: string, hint: 'A01 형식' }
      - { label: 정렬, name: order, widget: number, value_type: int, default: 0, hint: 클수록 위 }
      - { label: 비공개, name: draft, widget: boolean, default: false }

  # ────────────────────────────────────────────────────────────
  - name: experience
    label: 경력 (회사)
    description: 회사 단위. 프로젝트는 이 파일명을 '소속' 으로 참조합니다 — 파일명을 바꾸면 연결이 끊깁니다.
    folder: src/data/experience
    extension: md
    format: yaml-frontmatter
    create: false
    sortable_fields: [order, start]
    fields:
      - { label: 회사, name: company, widget: string }
      - { label: 역할, name: role, widget: string }
      - { label: 직급·팀, name: team, widget: string, required: false }
      - { label: 입사, name: start, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: 퇴사, name: end, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, required: false, hint: 비우면 '현재' }
      - { label: 요약, name: summary, widget: text }
      - label: 주요 성과
        name: highlights
        widget: list
        field: { label: 항목, name: item, widget: string }
      - label: 역량 태그
        name: skills
        widget: list
        required: false
        field: { label: 태그, name: tag, widget: string }
      - label: 관련 자산
        name: assetRefs
        widget: list
        required: false
        field: { label: 코드, name: code, widget: string }
      - { label: 정렬, name: order, widget: number, value_type: int, default: 0 }
      - { label: 비공개, name: draft, widget: boolean, default: false }
      - { label: 본문, name: body, widget: markdown, required: false }

  # ────────────────────────────────────────────────────────────
  - name: assets
    label: 자산 (설명)
    description: >-
      자산 페이지의 설명 부분입니다. 복사되는 본문은 아래 '자산 (복사 본문)' 에 따로 있습니다.
      두 파일의 이름은 같아야 하고, '복사 본문 파일' 칸이 그 연결 고리입니다.
    folder: src/data/assets
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{fields.payload}}'
    sortable_fields: [order, code, updated]
    fields:
      - { label: 코드, name: code, widget: string, pattern: ['^A\d{2}$', 'A01 형식으로 적으세요'] }
      - { label: 제목, name: title, widget: string }
      - { label: 한 줄 정의, name: summary, widget: string, pattern: ['^.{1,120}$', '120자 이내'] }
      - label: 형식
        name: kind
        widget: select
        options:
          - { label: 운영 규칙, value: rules }
          - { label: 프롬프트, value: prompt }
          - { label: 서브에이전트, value: subagent }
          - { label: 템플릿, value: template }
      - label: 묶음
        name: group
        widget: select
        default: flow
        options:
          - { label: 사업개발 업무 흐름, value: flow }
          - { label: 기획 리포 운영, value: ops }
          - { label: 산출물 제작, value: build }
      - { label: 붙이는 곳, name: install, widget: string }
      - { label: 복사 본문 파일, name: payload, widget: string, pattern: ['^[a-z0-9-]+$', '영문 소문자·숫자·하이픈만'], hint: 'src/payloads 의 파일명(확장자 제외). 이 값이 곧 이 파일의 이름이 됩니다.' }
      - { label: 정렬, name: order, widget: number, value_type: int }
      - label: 언제 쓰나
        name: whenToUse
        widget: list
        min: 2
        max: 4
        hint: 추상어 금지. 실제 상황으로.
        field: { label: 상황, name: item, widget: string }
      - { label: 안 쓰는 경우, name: whenNotToUse, widget: text, hint: 신뢰 장치. 해당 없으면 그렇게 적으세요 }
      - { label: 입력, name: input, widget: text, hint: 최소 입력을 반드시 명시 }
      - label: 사용법
        name: steps
        widget: list
        min: 1
        max: 3
        hint: 3단계 이내. 넘으면 자산 설계가 잘못된 것입니다.
        field: { label: 단계, name: item, widget: string }
      - label: 주의점·한계
        name: caveats
        widget: list
        required: false
        max: 3
        field: { label: 항목, name: item, widget: string }
      - label: 변경 이력
        name: changelog
        widget: list
        summary: '{{fields.version}} · {{fields.note}}'
        fields:
          - { label: 버전, name: version, widget: string }
          - { label: 날짜, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
          - { label: 내용, name: note, widget: string }
      - { label: 현재 버전, name: version, widget: string, default: v0.1 }
      - { label: 갱신일, name: updated, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - label: 관련 자산
        name: related
        widget: list
        required: false
        max: 2
        field: { label: 코드, name: code, widget: string }
      - { label: 홈 노출, name: featured, widget: boolean, default: false }
      - { label: 비공개, name: draft, widget: boolean, default: true, hint: 기본값이 비공개입니다. 살균을 마친 뒤에만 끄세요. }
      - { label: 출력 예시 · 이 규칙의 근거, name: body, widget: markdown }

  # ────────────────────────────────────────────────────────────
  - name: payloads
    label: 자산 (복사 본문)
    description: >-
      복사 버튼으로 나가는 원문입니다. 프론트매터 없이 본문만 있는 파일이고,
      여기 적은 그대로 사용자 클립보드에 들어갑니다. 200줄을 넘기지 마세요.
    folder: src/payloads
    extension: md
    create: false
    fields:
      - { label: 복사될 원문, name: body, widget: markdown }
